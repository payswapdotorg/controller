<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Controller</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1>Controller</h1>
      <p id="repo" class="muted">not configured</p>
    </div>
  </header>

  <section class="row">
    <button id="start" class="primary">Start loop</button>
    <button id="stop">Stop</button>
    <button id="tick">Run one cycle</button>
  </section>

  <section id="status" class="status">
    <div class="kv"><span>main</span><b id="st-main">—</b></div>
    <div class="kv"><span>cycles</span><b id="st-cycles">—</b></div>
    <div class="kv"><span>open PRs</span><b id="st-prs">—</b></div>
    <div class="kv"><span>open issues</span><b id="st-issues">—</b></div>
    <div class="kv"><span>last action</span><b id="st-action">—</b></div>
    <div class="kv"><span>driver</span><b id="st-driver">—</b></div>
  </section>

  <section>
    <h2>Intelligence sources <button id="test-intelligence" class="ghost">test</button></h2>
    <ul id="sources" class="sources"></ul>
  </section>

  <section class="row">
    <button id="attach">Attach chat.z.ai tab</button>
  </section>

  <section>
    <h2>Loop log <button id="refresh" class="ghost">refresh</button></h2>
    <ul id="log" class="log"></ul>
  </section>

  <footer>
    <a href="#" id="open-options">Settings</a>
    <span class="muted">repository = sole source of truth</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
